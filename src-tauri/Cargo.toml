[package]
name = "aperture"
default-run = "aperture"
version = "0.1.0"
edition = "2021"
description = "Read-only dashboard for externally started Claude Code and Codex sessions"

[lib]
name = "aperture_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
thiserror = "1"
open = "5"
rusqlite = { version = "0.31", features = ["bundled"] }
notify = "6"
notify-debouncer-mini = "0.4"

# `test-util` gives the paused clock (`#[tokio::test(start_paused = true)]`,
# `tokio::time::advance`) the reconcile-cadence tests in `lib.rs` need to
# simulate an OS suspend without sleeping for real. Dev-only: under resolver
# v2 a dev-dependency feature is not enabled for a normal build, so the
# shipped binary does not carry tokio's test clock.
[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
